    <body class="bg-light">
        <!-- HEADER -->
        <header>
            <div id="top-header">
                <div class="container">
                    <ul class="header-links float-start">
                        <li><a href="#"><i class="fa fa-phone"></i> +56 9 1234 5678</a></li>
                        <li><a href="#"><i class="fa fa-envelope-o"></i> contacto@CheckPointStore.cl</a></li>
                    </ul>
                </div>
            </div>

            <div id="header">
                <div class="container">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="header-logo">
                                <a href="../../index.html" class="logo">
                                    <img src="../../assets/img/Logo_Checkpoint.jpeg" alt="CheckPoint Store">
                                </a>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="header-search">
                                <form id="search-form">
                                <input class="input" id="search-input" placeholder="Buscar producto..." autocomplete="off">
                                <button class="search-btn" type="submit">Buscar</button>
                                </form>
                            </div>
                        </div>

                        <div class="col-md-3 clearfix">
                            <div class="header-ctn">
                                <!-- Cart -->
                                <div class="dropdown">
                                    <a href="carrito.html">
                                        <i class="fa fa-shopping-cart"></i>
                                        <span>Mi Carrito</span>
                                        <div class="qty" id="cart-qty">0</div>
                                    </a>
                                </div>
                                <!-- /Cart -->

                                <div class="menu-toggle">
                                    <a href="#">
                                        <i class="fa fa-bars"></i>
                                        <span>Menú</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- /HEADER -->

        <!-- NAVIGATION -->
        <nav id="navigation">
            <div class="container">
                <div id="responsive-nav">
                    <ul class="main-nav">

        <!-- BREADCRUMB -->
        <div id="breadcrumb" class="section">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <ul class="breadcrumb-tree">
                            <li><a href="../../index.html">Inicio</a></li>
                            <li class="active">Iniciar Sesión</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- /BREADCRUMB -->

        <!-- SECTION: Formulario de Login -->
        <div class="section">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        </div>

                        <!-- Tarjeta de Login -->
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-secondary text-white text-center py-2">
                                <h5 class="mb-0 fs-6 text-uppercase fw-semibold">Inicio de Sesión</h5>
                            </div>

                            <div class="card-body p-4">
                                <form id="formLogin" novalidate>

                                    <!-- Campo: Correo -->
                                    <div class="mb-3">
                                        <label for="correoLogin" class="form-label fw-semibold">Correo</label>
                                        <input type="email" class="form-control" id="correoLogin" maxlength="100" placeholder="nombre@ejemplo.com">
                                        <div class="invalid-feedback" id="errorCorreoLogin"></div>
                                    </div>

                                    <!-- Campo: Contraseña -->
                                    <div class="mb-4">
                                        <label for="passwordLogin" class="form-label fw-semibold">Contraseña</label>
                                        <input type="password" class="form-control" id="passwordLogin" minlength="8" placeholder="Ingresa tu contraseña">
                                        <div class="invalid-feedback" id="errorPasswordLogin"></div>
                                    </div>

                                    <!-- Botón de envío -->
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-dark py-2">Iniciar sesión</button>
                                    </div>

                                    <div class="text-center mt-3">
                                        <span class="text-muted small">¿No tienes cuenta? </span>
                                        <a href="registro.html" class="small text-decoration-none">Regístrate aquí</a>
                                    </div>

                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <!-- /SECTION -->

        <!-- FOOTER -->
        <footer id="footer">
            <div id="bottom-footer" class="section">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 text-center">

                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <!-- /FOOTER -->
