		<!-- Google font -->

		<!-- Bootstrap 5.3.8 (local) -->
		<link type="text/css" rel="stylesheet" href="../../assets/css/bootstrap.min.css"/>

		<!-- Slick -->
		<link type="text/css" rel="stylesheet" href="../../assets/css/slick.css"/>
		<link type="text/css" rel="stylesheet" href="../../assets/css/slick-theme.css"/>

		<!-- nouislider -->
		<link type="text/css" rel="stylesheet" href="../../assets/css/nouislider.min.css"/>

		<!-- Font Awesome Icon -->
		<link rel="stylesheet" href="../../assets/css/font-awesome.min.css">

		<!-- Custom stylesheet de Electro -->
		<link type="text/css" rel="stylesheet" href="../../assets/css/style.css"/>

		<!-- Nuestro CSS propio -->
		<link type="text/css" rel="stylesheet" href="../../assets/css/custom.css"/>
	</head>
	<body>
		<!-- HEADER -->
		<header>
			<div id="top-header">
				<div class="container">
					<ul class="header-links float-start">
						<li><a href="#"><i class="fa fa-phone"></i> +56 9 1234 5678</a></li>
						<li><a href="#"><i class="fa fa-envelope-o"></i> contacto@CheckPointStore.cl</a></li>
					</ul>
				</div>
			</div>

			<div id="header">
				<div class="container">
					<div class="row">
						<div class="col-md-3">
							<div class="header-logo">
							<a href="../../index.html" class="logo">
								<img src="../../assets/img/Logo_Checkpoint.png" alt="CheckPoint Store">
								</a>
							</div>
						</div>

						<div class="col-md-6">
							<div class="header-search">
								<form id="search-form">
								<input class="input" id="search-input" placeholder="Buscar producto..." autocomplete="off">
								<button class="search-btn" type="submit">Buscar</button>
								</form>
							</div>
						</div>

						<div class="col-md-3 clearfix">
							<div class="header-ctn">
								<!-- Cart -->
								<div class="dropdown">
									<a href="carrito.html">
										<i class="fa fa-shopping-cart"></i>
										<span>Mi Carrito</span>
										<div class="qty" id="cart-qty">0</div>
									</a>
								</div>
								<!-- /Cart -->

								<div class="menu-toggle">
									<a href="#">
										<i class="fa fa-bars"></i>
										<span>Menú</span>
									</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</header>
		<!-- /HEADER -->

		<!-- NAVIGATION -->
		<nav id="navigation">
			<div class="container">
				<div id="responsive-nav">
					<ul class="main-nav">
						<li><a href="../../index.html">Inicio</a></li>
						<li class="active"><a href="productos.html">Productos</a></li>
						<li><a href="contacto.html">Contacto</a></li>
					</ul>
				</div>
			</div>
		</nav>
		<!-- /NAVIGATION -->

		<!-- BREADCRUMB -->
		<div id="breadcrumb" class="section">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<ul class="breadcrumb-tree">
							<li><a href="../../index.html">Inicio</a></li>
							<li><a href="productos.html" id="breadcrumb-categoria">Productos</a></li>
							<li class="active" id="breadcrumb-nombre">Detalle</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
		<!-- /BREADCRUMB -->

		<!-- SECTION: detalle del producto -->
		<div class="section">
			<div class="container" id="product-detalle-container">
				<div class="row">
					<!-- Galería (imagen principal + miniaturas) -->
					<div class="col-md-5">
						<div id="product-main-img">
							<div class="product-preview">
								<img id="main-image-src" src="" alt="">
							</div>
						</div>
						<div id="product-imgs" class="row">
							<div class="col-4">
								<div class="product-preview">
									<img src="" alt="">
								</div>
							</div>
							<div class="col-4">
								<div class="product-preview">
									<img src="" alt="">
								</div>
							</div>
							<div class="col-4">
								<div class="product-preview">
									<img src="" alt="">
								</div>
							</div>
						</div>
					</div>
					<!-- /Galería -->

					<!-- Info del producto -->
					<div class="col-md-7">
						<div class="product-details">
							<h2 class="product-name" id="detalle-nombre"></h2>

							<div class="product-price" id="detalle-precio"></div>
							<span class="product-available" id="detalle-disponibilidad"></span>

							<p id="detalle-descripcion"></p>

							<div class="add-to-cart">
								<div class="qty-label">
									Cantidad
									<div class="input-number">
										<input type="number" id="cantidad-input" min="1" value="1">
										<span class="qty-up">+</span>
										<span class="qty-down">-</span>
									</div>
								</div>

								<button class="add-to-cart-btn" id="btn-agregar-carrito" type="button">
									<i class="fa fa-shopping-cart"></i> Añadir al carrito
								</button>
							</div>
						</div>
					</div>
					<!-- /Info del producto -->
				</div>
			</div>
		</div>
		<!-- /SECTION -->

		<!-- SECTION: productos relacionados -->
		<div class="section">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<div class="section-title">
							<h3 class="title">Productos relacionados</h3>
						</div>
					</div>
				</div>
				<div class="row" id="related-products-grid">
					<!-- Se llena dinámicamente vía producto-detalle.js -->
				</div>
			</div>
		</div>
		<!-- /SECTION -->

		<!-- FOOTER -->
		<footer id="footer">
			<div id="bottom-footer" class="section">
				<div class="container">
					<div class="row">
						<div class="col-md-12 text-center">
							<span class="copyright">
								Copyright &copy;<script>document.write(new Date().getFullYear());</script>
								Tienda de Videojuegos — Proyecto DuocUC
							</span>
						</div>
					</div>
				</div>
			</div>
		</footer>
		<!-- /FOOTER -->

		<script src="../../assets/js/bootstrap.bundle.min.js"></script>

		<!-- Nuestros scripts: datos, carrito y detalle de producto -->
		<script src="../../assets/js/data-productos.js"></script>
		<script src="../../assets/js/carrito.js"></script>
		<script src="../../assets/js/detalle-producto.js"></script>
	</body>
</html>
