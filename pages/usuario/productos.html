	<body>
		<!-- HEADER -->
		<header>
			<div id="top-header">
				<div class="container">
					<ul class="header-links float-start">
						<li><a href="#"><i class="fa fa-phone"></i> +56 9 1234 5678</a></li>
						<li><a href="#"><i class="fa fa-envelope-o"></i> contacto@CheckPointStore.cl</a></li>
					</ul>
				</div>
			</div>

			<div id="header">
				<div class="container">
					<div class="row">
						<div class="col-md-3">
							<div class="header-logo">
							<a href="../../index.html" class="logo">
								<img src="../../assets/img/Logo_Checkpoint.png" alt="CheckPoint Store">
								</a>
							</div>
						</div>

						<div class="col-md-6">
							<div class="header-search">

							</div>

						<div class="col-md-3 clearfix">

								<div class="menu-toggle">
									<a href="#">

						</div>

						</ul>

				</div>

					<div id="aside" class="col-md-3">
						<div class="aside">
							<h3 class="aside-title">Categorías</h3>
							<div class="checkbox-filter">
								<div class="input-checkbox">
									<input type="checkbox" id="category-juego" class="category-filter" value="juego">
									<label for="category-juego">
										<span></span>
										Juegos (digital y físico)
									</label>
								</div>
								<div class="input-checkbox">
									<input type="checkbox" id="category-consola" class="category-filter" value="consola">

									</label>

								<div class="input-checkbox">
									<input type="checkbox" id="category-accesorio" class="category-filter" value="accesorio">

										<span></span>
										Accesorios
									</label>

								<div class="input-checkbox">
									<input type="checkbox" id="category-figura" class="category-filter" value="figura">
									<label for="category-figura">
										<span></span>
										Figuras
									</label>
								</div>
							</div>
							<p style="margin-top:10px; font-size: 12px; color: #999;">
								Sin filtros marcados se muestran todos los productos.
							</p>

					</div>

							<span class="store-qty">Catálogo completo de la tienda</span>

						<div class="row" id="products-grid">

						</div>
						<!-- /store products -->
					</div>
					<!-- /STORE -->
